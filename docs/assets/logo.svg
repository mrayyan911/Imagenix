<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)" />
  
  <!-- Image frame -->
  <rect x="50" y="55" width="100" height="75" rx="8" fill="white" opacity="0.95"/>
  
  <!-- Mountains in image -->
  <polygon points="60,115 85,85 110,115" fill="#6366f1" opacity="0.8"/>
  <polygon points="90,115 120,75 140,115" fill="#8b5cf6" opacity="0.9"/>
  
  <!-- Sun -->
  <circle cx="125" cy="75" r="12" fill="#fbbf24"/>
  
  <!-- AI sparkle -->
  <g fill="white" transform="translate(130, 50)">
    <polygon points="10,0 12,8 20,10 12,12 10,20 8,12 0,10 8,8"/>
  </g>
  
  <!-- Bounding box indicator -->
  <rect x="75" y="80" width="40" height="30" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="75" cy="80" r="3" fill="#22c55e"/>
  <circle cx="115" cy="80" r="3" fill="#22c55e"/>
  <circle cx="75" cy="110" r="3" fill="#22c55e"/>
  <circle cx="115" cy="110" r="3" fill="#22c55e"/>
  
  <!-- Text -->
  <text x="100" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">IMAGENIX</text>
</svg>
