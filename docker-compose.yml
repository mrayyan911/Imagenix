services:
  # PostgreSQL Database
  postgres:
    image: postgres:15.6-alpine
    container_name: imagenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagenix
      POSTGRES_PASSWORD: imagenix_dev_password
      POSTGRES_DB: imagenix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imagenix -d imagenix']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and job queue
  redis:
    image: redis:7.2.4-alpine
    container_name: imagenix-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - S3 Compatible Object Storage (local development)
  minio:
    image: minio/minio:latest
    container_name: imagenix-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: imagenix-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/imagenix-uploads --ignore-existing;
      mc mb myminio/imagenix-exports --ignore-existing;
      mc anonymous set download myminio/imagenix-uploads;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: imagenix-network
